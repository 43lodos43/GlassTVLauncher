name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Generate Clean Files
        run: |
          mkdir -p app/src/main/res/drawable app/src/main/res/layout
          echo "" | base64 -d > app/src/main/AndroidManifest.xml
          echo "" | base64 -d > app/src/main/res/drawable/tv_wallpaper_gradient.xml
          echo "" | base64 -d > app/src/main/res/drawable/glass_card_bg.xml
          echo "" | base64 -d > app/src/main/res/layout/activity_main.xml
          echo "" | base64 -d > app/src/main/res/layout/item_app_glass.xml
      - name: Setup JDK
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.4'
          cache-disabled: true
      - name: Build APK
        run: gradle assembleDebug --no-daemon
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GlassTVLauncher
          path: app/build/outputs/apk/debug/app-debug.apk
