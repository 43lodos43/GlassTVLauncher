name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Generate Clean XMLs
        run: |
          python3 -c '
          import os
          os.makedirs("app/src/main/res/drawable", exist_ok=True)
          os.makedirs("app/src/main/res/layout", exist_ok=True)
          
          manifest = """<?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://android.com">
              <uses-feature android:name="android.software.leanback" android:required="true" />
              <uses-feature android:name="android.hardware.touchscreen" android:required="false" />
              <uses-permission android:name="android.permission.QUERY_ALL_PACKAGES" />
              <application android:allowBackup="true" android:label="Glass TV Launcher" android:theme="@android:style/Theme.DeviceDefault.NoActionBar">
                  <activity android:name=".MainActivity" android:exported="true" android:launchMode="singleTask" android:stateNotNeeded="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.HOME" />
                          <category android:name="android.intent.category.DEFAULT" />
                          <category android:name="android.intent.category.LEANBACK_LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>"""
          
          wall = """<?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://android.com">
              <gradient android:angle="135" android:startColor="#0F172A" android:centerColor="#1E293B" android:endColor="#090D16" android:type="linear" />
          </shape>"""
          
          card = """<?xml version="1.0" encoding="utf-8"?>
          <selector xmlns:android="http://android.com">
              <item android:state_focused="true">
                  <shape android:shape="rectangle">
                      <solid android:color="#4DFFFFFF" />
                      <stroke android:width="2dp" android:color="#CCFFFFFF" />
                      <corners android:radius="16dp" />
                  </shape>
              </item>
              <item>
                  <shape android:shape="rectangle">
                      <solid android:color="#1AFFFFFF" />
                      <stroke android:width="1dp" android:color="#33FFFFFF" />
                      <corners android:radius="16dp" />
                  </shape>
              </item>
          </selector>"""
          
          act_main = """<?xml version="1.0" encoding="utf-8"?>
          <FrameLayout xmlns:android="http://android.com"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:background="@drawable/tv_wallpaper_gradient"
              android:padding="32dp">
              <androidx.recyclerview.widget.RecyclerView
                  android:id="@+id/appsRecyclerView"
                  android:layout_width="match_parent"
                  android:layout_height="match_parent"
                  android:clipToPadding="false"
                  android:padding="16dp" />
          </FrameLayout>"""
          
          item_app = """<?xml version="1.0" encoding="utf-8"?>
          <LinearLayout xmlns:android="http://android.com"
              android:layout_width="match_parent"
              android:layout_height="150dp"
              android:layout_margin="12dp"
              android:background="@drawable/glass_card_bg"
              android:clickable="true"
              android:focusable="true"
              android:gravity="center"
              android:orientation="vertical"
              android:padding="16dp">
              <ImageView
                  android:id="@+id/appIcon"
                  android:layout_width="64dp"
                  android:layout_height="64dp"
                  android:scaleType="fitCenter" />
              <TextView
                  android:id="@+id/appName"
                  android:layout_width="wrap_content"
                  android:layout_height="wrap_content"
                  android:layout_marginTop="12dp"
                  android:ellipsize="end"
                  android:maxLines="1"
                  android:textColor="#FFFFFF"
                  android:textSize="14sp"
                  android:textStyle="bold" />
          </LinearLayout>"""
          
          open("app/src/main/AndroidManifest.xml", "w").write(manifest)
          open("app/src/main/res/drawable/tv_wallpaper_gradient.xml", "w").write(wall)
          open("app/src/main/res/drawable/glass_card_bg.xml", "w").write(card)
          open("app/src/main/res/layout/activity_main.xml", "w").write(act_main)
          open("app/src/main/res/layout/item_app_glass.xml", "w").write(item_app)
          '
      - name: Setup JDK
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.4'
          cache-disabled: true
      - name: Build APK
        run: gradle assembleDebug --no-daemon
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GlassTVLauncher
          path: app/build/outputs/apk/debug/app-debug.apk
